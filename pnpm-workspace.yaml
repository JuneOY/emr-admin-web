# pnpm 12 默认禁止依赖执行安装脚本，未审批会报 ERR_PNPM_IGNORED_BUILDS。
# 逐项审批：true 允许执行，false 明确拒绝（同样视为已审批，不会报错）。
allowBuilds:
  # 原生二进制 / 构建链路需要执行安装脚本
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  vue-demi: true
  electron-winstaller: true
  # 安装脚本只打印捐赠提示，无实际构建作用
  core-js: false
  es5-ext: false
