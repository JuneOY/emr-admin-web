appId: com.emr.desktop
productName: 门诊病历
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
# 走镜像下载 Electron，避免 GitHub Releases 在国内超时（CI 上同样可用）。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
